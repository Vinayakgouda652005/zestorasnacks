<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850">
    <defs>
      <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06" />
      </filter>
      <clipPath id="avatarClip">
        <circle cx="200" cy="95" r="28" />
      </clipPath>
    </defs>

    <!-- Outer background with soft tint matching original -->
    <rect width="600" height="850" fill="#EEF2FA" />

    <!-- Top User profile -->
    <g transform="translate(0, 0)">
      <!-- Avatar background / placeholder portrait -->
      <circle cx="210" cy="115" r="28" fill="#5B7083" />
      <!-- Stylized silhouette & sunglasses matching profile -->
      <circle cx="210" cy="107" r="10" fill="#E8EEF5" />
      <path d="M 194 135 C 196 122, 224 122, 226 135 Z" fill="#2E3A48" />
      <!-- Sunglasses -->
      <rect x="204" y="105" width="5" height="3" rx="1" fill="#1C242B" />
      <rect x="211" y="105" width="5" height="3" rx="1" fill="#1C242B" />
      <line x1="209" y1="106.5" x2="211" y2="106.5" stroke="#1C242B" stroke-width="1" />

      <!-- Name -->
      <text x="250" y="124" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#2B3441">Vinayak Gouda</text>
    </g>

    <!-- White Center Card with rounded corners -->
    <rect x="70" y="175" width="460" height="530" rx="36" ry="36" fill="#FFFFFF" filter="url(#cardShadow)" />

    <!-- QR Code Container -->
    <g transform="translate(100, 205)">
      <svg width="400" height="400" viewBox="0 0 47 47">
        <path fill="#000000" d="M0 0h47v47H0z" shape-rendering="crispEdges"/>
      </svg>
      <!-- Center GPay Emblem -->
      <circle cx="200" cy="200" r="38" fill="#FFFFFF" />
      <circle cx="200" cy="200" r="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <!-- GPay colors badge -->
      <g transform="translate(182, 182) scale(1.5)">
        <!-- Blue bar -->
        <path d="M 5 11 C 5 7.5, 8.5 7, 11 7 L 13 7 C 15 7, 18 8.5, 18 12 C 18 15, 15 17, 12 17 L 9 17 C 7 17, 5 15, 5 11 Z" fill="#4285F4" opacity="0.95" />
        <!-- Yellow / Green / Red accents -->
        <path d="M 8 16 C 6 15, 6 12, 8 10 L 13 14 C 11 17, 9 17, 8 16 Z" fill="#34A853" />
        <path d="M 12 7 C 15 7, 17 9, 17 12 L 13 15 C 11 12, 11 8, 12 7 Z" fill="#FBBC04" />
        <path d="M 16 11 C 18 12, 17 15, 15 16 L 11 12 C 13 9, 15 9, 16 11 Z" fill="#EA4335" />
      </g>
    </g>

    <!-- UPI ID inside Card -->
    <text x="300" y="660" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#333F4D" text-anchor="middle" letter-spacing="0.3">UPI ID: vinayakgouda51@oksbi</text>

    <!-- Bottom text -->
    <text x="300" y="760" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F6D7E" text-anchor="middle">Scan to pay with any UPI app</text>
  </svg>