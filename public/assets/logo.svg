<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%" fill="none">
  <!-- ZESTORA Official Brand Logo with Leaf Sprout Motif -->
  <g fill="#1A3724">
    
    <!-- ZESTORA Wordmark using stylized serif typography -->
    <text x="380" y="132" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', 'Georgia', serif" 
          font-size="104" 
          font-weight="700" 
          letter-spacing="0.05em" 
          text-anchor="middle">
      ZEST<tspan dx="26">RA</tspan>
    </text>

    <!-- Stylized Botanical 'O' with Sprouting Foliage Motif -->
    <!-- Positioned precisely between T and R -->
    <g transform="translate(432, 94)">
      <!-- Oval Body of the O -->
      <ellipse cx="0" cy="0" rx="34" ry="38" stroke="#1A3724" stroke-width="14" fill="none" />
      
      <!-- Sprouting Twin Leaves at the Top Apex of 'O' -->
      <!-- Right primary leaf (taller, arching to upper right) -->
      <path d="M-2 -38 C 2 -64, 25 -86, 33 -94 C 33 -72, 25 -52, 6 -39 Z" fill="#1A3724" />
      <!-- Subtle interior leaf vein highlight -->
      <path d="M-1 -39 C 9 -58, 20 -72, 29 -86" stroke="#FAF7F2" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

      <!-- Left secondary leaf (smaller, angling to upper left) -->
      <path d="M-4 -38 C -13 -56, -30 -66, -35 -70 C -28 -54, -16 -44, -5 -37 Z" fill="#1A3724" />
      <!-- Stem notch connector anchoring inside the O rim -->
      <path d="M-2 -32 L -1 -42" stroke="#1A3724" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- TM Trademark symbol at upper right of letter 'A' -->
    <text x="644" y="64" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="0.02em">
      TM
    </text>

    <!-- Subtitle: Nature's Crunch -->
    <text x="380" y="186" 
          font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" 
          font-size="32" 
          font-weight="400" 
          letter-spacing="0.22em" 
          text-anchor="middle">
      Nature's Crunch
    </text>
  </g>
</svg>